[project]
name = "supplier-invoice-exception-agent"
version = "0.1.0"
description = "Investigate synthetic invoice exceptions and save a reviewable draft"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.165.0",
    "openai-agents==0.25.0",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
